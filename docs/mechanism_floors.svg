</style><rect width="720" height="300" class="surface"/><text x="24" y="26" font-size="15" font-weight="600" class="ink">Both speedups have a floor below which they pay nothing</text><text x="24" y="45" font-size="12" class="muted">Isolated micro-benchmarks · one RTX 5090 · median of five runs after warm-up</text><text x="24" y="72" font-size="12.5" class="ink2">branches sharing one observation</text><line x1="24" y1="195.1" x2="324" y2="195.1" class="rule-soft" stroke-width="1"/><text x="16" y="199.1" font-size="10.5" text-anchor="end" class="muted num">1×</text><line x1="24" y1="148.2" x2="324" y2="148.2" class="rule-soft" stroke-width="1"/><text x="16" y="152.2" font-size="10.5" text-anchor="end" class="muted num">2×</text><line x1="24" y1="101.4" x2="324" y2="101.4" class="rule-soft" stroke-width="1"/><text x="16" y="105.4" font-size="10.5" text-anchor="end" class="muted num">3×</text><line x1="24" y1="195.1" x2="324" y2="195.1" class="rule" stroke-width="1" stroke-dasharray="4 3"/><path d="M42.8 242 v-42.6 a4 4 0 0 1 4 -4 h29.5 a4 4 0 0 1 4 4 v42.6 z" class="dom" fill-opacity="0.45"/><text x="61.5" y="188.4" font-size="11.5" text-anchor="middle" class="ink num">0.99×</text><text x="61.5" y="258" font-size="11" text-anchor="middle" class="muted num">1</text><path d="M117.8 242 v-88.3 a4 4 0 0 1 4 -4 h29.5 a4 4 0 0 1 4 4 v88.3 z" class="vis" fill-opacity="1.0"/><text x="136.5" y="142.7" font-size="11.5" text-anchor="middle" class="ink num">1.97×</text><text x="136.5" y="258" font-size="11" text-anchor="middle" class="muted num">2</text><path d="M192.8 242 v-93.3 a4 4 0 0 1 4 -4 h29.5 a4 4 0 0 1 4 4 v93.3 z" class="vis" fill-opacity="1.0"/><text x="211.5" y="137.7" font-size="11.5" text-anchor="middle" class="ink num">2.08×</text><text x="211.5" y="258" font-size="11" text-anchor="middle" class="muted num">3</text><path d="M267.8 242 v-109.6 a4 4 0 0 1 4 -4 h29.5 a4 4 0 0 1 4 4 v109.6 z" class="vis" fill-opacity="1.0"/><text x="286.5" y="121.4" font-size="11.5" te